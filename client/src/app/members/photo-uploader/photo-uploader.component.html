@if(uploader) {
<div ng2FileDrop [uploader]="uploader" [ngClass]="{ 'file-over': hasBaseDropZoneOver }"
    (fileOver)="hasBaseDropZoneOver = $event" class="mt-3 p-3 text-center upload-box">
    <p>Drag & drop photo here</p>
    <input type="file" ng2FileSelect [uploader]="uploader" class="text-center" style="margin-left: 6rem !important;" />
    <div class="progress mt-3">
        <div class="progress-bar" role="progressbar" [ngStyle]="{ 'width': uploader.progress + '%' }"></div>
    </div>
</div>

<ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let item of uploader.queue">
        {{ item?.file?.name }}
        <button class="btn btn-success btn-sm" (click)="item.upload()">Upload</button>
    </li>
</ul>
}
